<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Socle 1 + Socle 2</title><style>body{font-family:Arial;background:#f4f6f9;margin:0;color:#222}header{background:#fff29a;padding:20px;text-align:center;color:#20347f;font-size:24px;font-weight:bold}main{max-width:950px;margin:auto;padding:15px}.box{background:#fff;border-radius:14px;padding:18px;margin:12px 0}.choice{display:block;width:100%;text-align:left;background:#fff;border:2px solid #ddd;border-radius:9px;padding:14px;margin:9px 0;font-size:15px;cursor:pointer}.sel{border-color:#20347f;background:#eef1ff}.btn{background:#20347f;color:#fff;border:0;border-radius:9px;padding:14px 20px;font-weight:bold;font-size:16px;cursor:pointer}.hidden{display:none}.timer{float:right;color:#b42318;font-weight:bold}.err{background:#fff0f0;padding:12px;border-radius:9px;margin:8px 0}.ok{background:#edf9f0;padding:12px;border-radius:9px}</style></head><body><header>🚛 TEST — SOCLE 1 + SOCLE 2</header><main>
<div id="home" class="box"><h2>Test complet des deux socles</h2><ol><li>Socle 1 : intérieur</li><li>Socle 1 : extérieur</li><li>Socle 2 : procédure complète dans l'ordre exact</li></ol><p><b>Une réponse validée est définitive.</b></p><button class="btn" id="start">COMMENCER</button></div>
<div id="exam" class="hidden"><div class="box"><b id="title"></b><span class="timer" id="timer"></span><div id="sub"></div></div><div id="q" class="box"></div><button class="btn" id="next" disabled>VALIDER</button></div>
<div id="done" class="hidden box"><h2>Test terminé</h2><div id="result"></div></div></main>
<script>
var I=["Monter avec 3 points d’appui.","Fermer la porte sauf consigne contraire de l’inspecteur.","Baisser la vitre.","Mettre le contact.","Voyant de frein de parc allumé, frein de parc enclenché, véhicule immobilisé.","J'ai les documents de bord.","Je n’ai pas de voyant de cabine allumé, donc cabine verrouillée.","J’allume les feux de croisement et les feux de détresse.","Je procède à la vérification extérieure.","Remonter la vitre. Ouvrir la porte entièrement. Descendre avec 3 points d’appui. Fermer la porte et mettre les gants."];
var E=[
["Devant du véhicule",["Feux de gabarit","Pare-brise","Glace d’antéviseur","Carrosserie","Feux de croisement","Feux de détresse","Pas d’anomalie"]],
["Côté passager — cabine",["Carrosserie","Vitres latérales","Glaces de rétroviseur","Répétiteur de feux de détresse","Roue"]],
["Plaque de tare",["PTAC","Longueur","Largeur","Hauteur"]],
["Côté passager — carrosserie / bâche",["Carrosserie de type bâche","Sangles","Cliquets","Ligne de feux orangés","Roue arrière"]],
["Derrière le véhicule",["Feux de gabarit","Carrosserie","Chargement","Feux rouges","Feux de détresse"]],
["Essai des feux stop",["ESSAI !"]],
["Côté conducteur — carrosserie / bâche",["Carrosserie de type bâche","Sangles","Cliquets","Feux orangés","Roue arrière"]],
["Côté conducteur — cabine",["Carrosserie","Vitres latérales","Glaces de rétroviseur","Répétiteur de feux de détresse","Roue"]]
];
var S=["Je vérifie mon manomètre d'air. La pression est comprise entre 8 et 12 bars.","Je vais procéder à l'essai du frein de parc.","Je passe une vitesse.","Je maintiens le frein de parc.","J'accélère.","Bonne retenue du véhicule.","Je retire le frein de parc.","Pas de chute de pression anormale.","Ma pression est toujours entre 8 et 12 bars.","Je vais procéder à l'essai du frein de service.","J'accélère et avance.","Je freine.","Tout en gardant le pied sur le frein de service.","Pas de chute de pression anormale.","Ma pression est toujours entre 8 et 12 bars.","Je sécurise en mettant au neutre et en enclenchant le frein de parc.","J'annonce : essai du frein de parc et de service concluant.","Essai de freins terminé. Socle 2 terminé."];
var stage=0,pos=0,items=[],sel=-1,errors=[],timer;
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function showChoices(title,arr){items=arr;pos=0;document.getElementById("title").textContent=title;render()}
function render(){var x=items[pos];document.getElementById("sub").textContent=(pos+1)+" / "+items.length;document.getElementById("q").innerHTML="<b>"+x.q+"</b>"+x.o.map((z,i)=>"<button class='choice' data-i='"+i+"'>"+String.fromCharCode(65+i)+" — "+z+"</button>").join("");sel=-1;document.getElementById("next").disabled=true;document.querySelectorAll(".choice").forEach(b=>b.onclick=function(){sel=+b.dataset.i;document.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");document.getElementById("next").disabled=false})}
function orderItems(title,steps){var correct=steps.join(" → "),wrong=[];for(var i=0;i<3;i++){var a=steps.slice();var j=1+i%Math.max(1,steps.length-1),k=(j+1)%steps.length,t=a[j];a[j]=a[k];a[k]=t;wrong.push(a.join(" → "))}return [{q:title,o:sh([correct].concat(wrong)),c:correct}]}
function startInterior(){stage=1;var arr=[];arr.push({q:"Socle 1 intérieur — quel ordre respecte le début de la procédure ?",o:sh([[I[0],I[1],I[2],I[3],I[4]].join(" → "),[I[0],I[1],I[3],I[2],I[4]].join(" → "),[I[0],I[2],I[1],I[3],I[4]].join(" → "),[I[0],I[1],I[2],I[4],I[3]].join(" → ")])});arr[arr.length-1].c=arr[arr.length-1].o.indexOf([I[0],I[1],I[2],I[3],I[4]].join(" → "));
arr.push({q:"Socle 1 intérieur — documents, verrouillage et feux : quel ordre respecte la procédure ?",o:sh([[I[5],I[6],I[7]].join(" → "),[I[6],I[5],I[7]].join(" → "),[I[5],I[7],I[6]].join(" → "),[I[7],I[5],I[6]].join(" → ")] )});arr[arr.length-1].c=arr[arr.length-1].o.indexOf([I[5],I[6],I[7]].join(" → "));
arr.push({q:"Socle 1 intérieur — fin du contrôle : quel ordre respecte la procédure ?",o:sh([[I[7],I[8],I[9]].join(" → "),[I[8],I[7],I[9]].join(" → "),[I[7],I[9],I[8]].join(" → "),[I[9],I[7],I[8]].join(" → ")] )});arr[arr.length-1].c=arr[arr.length-1].o.indexOf([I[7],I[8],I[9]].join(" → "));
items=arr;pos=0;document.getElementById("title").textContent="SOCLE 1 — INTÉRIEUR — ORDRE EXACT";render()}
function startExterior(){stage=2;var arr=E.map(function(sec){var c=sec[1],bad1=c.slice(0,-1),bad2=c.slice(1),bad3=c.slice();if(bad3.length>1){var t=bad3[0];bad3[0]=bad3[1];bad3[1]=t}var opts=[c.join(" • "),bad1.join(" • "),bad2.join(" • "),bad3.join(" • ")];return{q:"Socle 1 extérieur — "+sec[0]+" : quelle proposition contient tout ce qui doit être contrôlé/annoncé ?",o:sh(opts),c:opts.indexOf(c.join(" • "))}});items=arr;pos=0;document.getElementById("title").textContent="SOCLE 1 — EXTÉRIEUR";render()}
function startS2(){stage=3;var correct=S.join(" → "),a=S.slice();var wrong=[];for(var z=0;z<3;z++){var b=a.slice(),j=1+z,k=j+1;if(k<b.length){var t=b[j];b[j]=b[k];b[k]=t}wrong.push(b.join(" → "))}items=[{q:"SOCLE 2 — quelle procédure complète respecte exactement l'ordre imposé ?",o:sh([correct].concat(wrong)),c:0}];items[0].c=items[0].o.indexOf(correct);pos=0;document.getElementById("title").textContent="SOCLE 2 — ORDRE EXACT";render()}
function next(){if(sel<0)return;var x=items[pos];if(sel!==x.c)errors.push({q:x.q,expected:x.o[x.c],got:x.o[sel]});if(pos<items.length-1){pos++;render()}else if(stage===1){startExterior()}else if(stage===2){startS2()}else finish()}
function finish(){clearInterval(timer);var h="<h3>"+(errors.length===0?"Aucune erreur":"Erreurs : "+errors.length)+"</h3>";errors.forEach(function(e){h+="<div class='err'><b>"+e.q+"</b><br>Réponse attendue : "+e.expected+"<br>Réponse choisie : "+e.got+"</div>"});document.getElementById("result").innerHTML=h;document.getElementById("exam").classList.add("hidden");document.getElementById("done").classList.remove("hidden")}
document.getElementById("start").onclick=function(){document.getElementById("home").classList.add("hidden");document.getElementById("exam").classList.remove("hidden");errors=[];var s=900;timer=setInterval(function(){s--;document.getElementById("timer").textContent=Math.floor(s/60).toString().padStart(2,"0")+":"+String(s%60).padStart(2,"0");if(s<=0)finish()},1000);startInterior()};
document.getElementById("next").onclick=next;
</script></body></html>
