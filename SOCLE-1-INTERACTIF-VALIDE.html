<script>
/* Lecture vocale naturelle : conserve la ponctuation et marque les pauses. */
window.__speechToken = 0;
window.__speechTimer = null;
window.__speechPaused = false;
window.__speechPausedBetweenChunks = false;
window.__speechNext = null;
window.__nativeSpeechCancel = window.speechSynthesis && window.speechSynthesis.cancel ? window.speechSynthesis.cancel.bind(window.speechSynthesis) : function(){};
function naturalSpeechCancel(){
  window.__speechToken++;
  window.__speechPaused=false; window.__speechPausedBetweenChunks=false; window.__speechNext=null;
  if(window.__speechTimer){ clearTimeout(window.__speechTimer); window.__speechTimer=null; }
  window.__nativeSpeechCancel();
}
function naturalSpeechPause(){
  window.__speechPaused = true;
  if(window.__speechTimer){ clearTimeout(window.__speechTimer); window.__speechTimer=null; window.__speechPausedBetweenChunks=true; }
  try{ window.speechSynthesis.pause(); }catch(e){}
}
function naturalSpeechResume(){
  if(!window.__speechPaused) return;
  window.__speechPaused = false;
  try{ window.speechSynthesis.resume(); }catch(e){}
  if(window.__speechPausedBetweenChunks && typeof window.__speechNext === 'function'){
    window.__speechPausedBetweenChunks=false;
    window.__speechNext();
  }
}
function naturalSpeak(text, rate){
  if(!('speechSynthesis' in window) || !text) return;
  naturalSpeechCancel();
  const token=window.__speechToken;
  const source=String(text).replace(/\r/g,'').replace(/[•→←✓]/g,' ').replace(/[ \t]+/g,' ').trim();
  const parts=[];
  source.split(/\n+/).forEach((line,li,arr)=>{
    const s=line.trim(); if(!s) return;
    const re=/([^,;:.!?…]+[,;:.!?…]?)/g; let m;
    while((m=re.exec(s))){
      const chunk=m[1].trim(); if(!chunk) continue;
      const last=chunk.slice(-1); let pause=180;
      if(last===',') pause=280;
      else if(last===';' || last===':') pause=450;
      else if('.!?…'.includes(last)) pause=650;
      parts.push({text:chunk,pause:pause});
    }
    if(li<arr.length-1 && parts.length) parts[parts.length-1].pause=Math.max(parts[parts.length-1].pause,850);
  });
  if(!parts.length) parts.push({text:source,pause:0});
  let i=0;
  function next(){
    window.__speechNext=next;
    if(token!==window.__speechToken || i>=parts.length) return;
    if(window.__speechPaused){ window.__speechPausedBetweenChunks=true; return; }
    const p=parts[i++];
    const u=new SpeechSynthesisUtterance(p.text);
    u.lang='fr-FR'; u.rate=rate||0.82; u.pitch=1; u.volume=1;
    u.onend=()=>{ if(token===window.__speechToken) window.__speechTimer=setTimeout(next,p.pause); };
    u.onerror=()=>{ if(token===window.__speechToken) window.__speechTimer=setTimeout(next,120); };
    window.speechSynthesis.speak(u);
  }
  next();
}
</script>

<script id="voiceStopOnPageExit">
/* Arrête immédiatement la lecture vocale dès que l'utilisateur quitte cette page. */
(function(){
  function stopVoiceOnExit(){
    try { if (typeof naturalSpeechCancel === 'function') naturalSpeechCancel(); } catch(e) {}
    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch(e) {}
  }
  window.addEventListener('pagehide', stopVoiceOnExit);
  window.addEventListener('beforeunload', stopVoiceOnExit);
  document.addEventListener('click', function(e){
    var a=e.target.closest && e.target.closest('a[href]');
    if(a && !a.hasAttribute('download') && (a.target||'_self') === '_self') stopVoiceOnExit();
  }, true);
})();
</script>
