<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THÈME 4 — Roue, direction, suspension</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fa;color:#172033}main{max-width:850px;margin:auto;padding:20px 14px 50px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button{border:1px solid #d9dee8;background:#fff;border-radius:10px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer}.nav .next{background:#1769aa;color:#fff}.nav .listen{background:#eaf4fb;color:#0b568c}.nav .mode{background:#1769aa;color:#fff;text-decoration:none;display:inline-flex;align-items:center;border:1px solid #1769aa;border-radius:10px;padding:11px 14px;font-weight:700}.official-panel{display:none;margin:14px 0;background:#fff;border:1px solid #d9dee8;border-radius:12px;padding:10px}.official-panel.open{display:block}.official-panel img{width:100%;height:auto;display:block;border-radius:8px}.top{display:flex;justify-content:space-between;gap:12px}.section{font-size:14px;color:#667085}h2{font-size:23px;margin:3px 0 15px}.count{background:#f0f3f7;padding:6px 10px;border-radius:99px;font-weight:750;height:max-content}.memo,.note{background:#f0f3f7;border:1px solid #d9dee8;border-radius:12px;padding:14px;margin-bottom:15px}.group{margin:18px 0}.group h3{font-size:17px;margin:0 0 9px}.step{display:flex;gap:10px;background:#f0f3f7;border-radius:10px;padding:12px;margin:8px 0}.say{background:#eaf4fb;border-left:4px solid #1769aa;border-radius:8px;padding:12px;margin:8px 0;font-weight:700}.progress{height:8px;background:#e1e5ec;border-radius:99px;overflow:hidden;margin-top:22px}.bar{height:100%;background:#1769aa}@media(max-width:600px){h2{font-size:21px}}</style></head><body><main><div class="nav"><button id="prev">← Précédente</button><button id="next" class="next">Suivante →</button><button id="listen" class="listen">🔊 ÉCOUTER</button><button id="stop" style="background:#b42318;color:#fff">■ ARRÊT</button><a class="mode" href="theme-4-interactif.html">🎯 VERSION INTERACTIVE</a><button id="officialBtn" class="mode">📘 VERSION OFFICIELLE INSPECTEUR</button></div><div id="officialPanel" class="official-panel"><img src="theme4-version-officielle-inspecteur.png" alt="Thème 4 — version officielle inspecteur"></div><div class="top"><div><div id="section" class="section"></div><h2 id="title"></h2></div><div id="count" class="count"></div></div><div id="memo"></div><div id="content"></div><div class="progress"><div id="bar" class="bar"></div></div></main><script>const A=(t,d=[],s=[],n='')=>({t,d,s,n}),S=(t,x,m='')=>({t,x,m});
const D=[S('THÈME 4 — Roue, direction, suspension',[
A('1. Roue arrière jumelée',['Effectuer le contrôle sur une roue arrière jumelée, du haut vers le bas.'],['Je suis en présence d’une roue jumelée.','Mon garde-boue et ma bavette sont en bon état et bien fixés.','Ma bande de roulement est en bon état.','Mon flanc est en bon état, ne présente pas d’hernie ni de déchirure.','Mes boulons sont tous présents et semblent bien fixés.','Je n’ai pas de corps étranger à l’intérieur de mes roues jumelées.','Ma pression semble bonne au vu de l’écrasement du pneu.','Mon amortisseur est en bon état, il n’y a pas de tache au sol.','Ma suspension ou mon coussin d’air est en bon état car je n’entends pas de fuite d’air.']),
A('2. Direction',[],['Pour vérifier la direction, il y a deux possibilités.','La première : je bascule la cabine pour vérifier le niveau dans le bocal de direction.','La deuxième : j’avance de quelques mètres avec le véhicule, je tourne le volant à fond à droite, à fond à gauche, pour m’assurer qu’il n’y a pas de dureté ou de bruit anormal.','Thème 4 terminé.'])])];
let st=0;const s=D[0],content=document.querySelector('#content'),title=document.querySelector('#title'),section=document.querySelector('#section'),count=document.querySelector('#count'),memo=document.querySelector('#memo'),bar=document.querySelector('#bar'),prev=document.querySelector('#prev'),next=document.querySelector('#next');
function cancelSpeech(){if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function render(){cancelSpeech();const x=s.x[st];section.textContent=s.t;title.textContent=x.t;count.textContent=(st+1)+' / '+s.x.length;bar.style.width=((st+1)/s.x.length*100)+'%';memo.innerHTML=s.m?'<div class="memo">'+s.m+'</div>':'';let h='';if(x.d.length)h+='<div class="group"><h3>👣 CE QUE JE FAIS</h3>'+x.d.map((v,i)=>'<div class="step"><strong>'+(i+1)+'.</strong><span>'+v+'</span></div>').join('')+'</div>';if(x.s.length)h+='<div class="group"><h3>🗣️ CE QUE JE DIS</h3>'+x.s.map(v=>'<div class="say">« '+v+' »</div>').join('')+'</div>';if(x.n)h+='<div class="note"><strong>📝 '+x.n+'</strong></div>';content.innerHTML=h;prev.disabled=st===0;prev.style.opacity=st===0?'.45':'1';next.textContent=st===s.x.length-1?'✓ Terminé':'Suivante →'}
prev.onclick=()=>{if(st>0){st--;render();scrollTo(0,0)}};next.onclick=()=>{if(st<s.x.length-1){st++;render();scrollTo(0,0)}};document.querySelector('#listen').onclick=()=>{const x=s.x[st],txt=[x.t,...x.d,...x.s].join(' ');if(!('speechSynthesis' in window))return;cancelSpeech();const u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)};document.querySelector('#stop').onclick=cancelSpeech;document.querySelector('#officialBtn').onclick=()=>document.querySelector('#officialPanel').classList.toggle('open');window.addEventListener('beforeunload',cancelSpeech);render();</script></body></html>
