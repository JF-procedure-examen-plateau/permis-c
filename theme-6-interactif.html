<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thème 6 — Interactif</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.top{position:sticky;top:0;z-index:10;background:#f4f6f9;border-bottom:1px solid #d8dee8;padding:8px}.topin{max-width:1100px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;text-decoration:none;padding:9px 13px;border:1px solid #a8cce8;border-radius:10px;background:#edf7ff;color:#125c91;font-weight:800;font-size:14px}
main{max-width:1100px;margin:auto;padding:12px 8px 28px}h1{font-size:24px;margin:3px 0}.sub{margin:0 0 10px;color:#667085}.box{background:#fff;border:1px solid #d9dee8;border-radius:16px;padding:8px;box-shadow:0 3px 14px #0001}.page{display:none}.page.active{display:block}.photo{position:relative;width:100%;aspect-ratio:704/384;background-image:url('theme6-clean.jpg');background-size:200% 200%;background-repeat:no-repeat;border-radius:12px;overflow:hidden}.p1{background-position:0 0}.p2{background-position:100% 0}.p3{background-position:0 100%}.p4{background-position:100% 100%}
.hot{position:absolute;z-index:3;transform:translate(-50%,-50%);width:58px;height:58px;border:0;border-radius:50%;background:#e60000;color:#fff;font-size:25px;font-weight:900;cursor:pointer;box-shadow:0 2px 7px #0006}.hot:focus{outline:4px solid #8bc7ef}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.nav button{border:0;border-radius:10px;background:#1769aa;color:white;font-weight:850;font-size:16px;padding:11px 17px;cursor:pointer}.nav button:disabled{opacity:.35}.count{font-weight:800;color:#667085}
@media(max-width:600px){h1{font-size:20px}.hot{width:44px;height:44px;font-size:19px}.btn{font-size:12px;padding:8px 10px}}
</style></head><body>
<div class="top"><div class="topin"><a class="btn" href="theme-6-menu.html">← Thème 6</a><a class="btn" href="theme-6.html">📝 Version écrite</a><a class="btn" href="trame-theme-6.html">📋 Trame inspecteur</a></div></div>
<main><h1>🎯 Thème 6 — Interactif</h1><p class="sub">Clique sur un numéro pour écouter.</p><div class="box">
<div class="page active"><div class="photo p1"><button class="hot" style="left:50%;top:55%" onclick="say(1)">1</button></div></div>
<div class="page"><div class="photo p2"><button class="hot" style="left:72%;top:53%" onclick="say(2)">1</button><button class="hot" style="left:28%;top:53%" onclick="say(3)">2</button></div></div>
<div class="page"><div class="photo p3"><button class="hot" style="left:19%;top:66%" onclick="say(4)">1</button><button class="hot" style="left:50%;top:72%" onclick="say(5)">2</button><button class="hot" style="left:76%;top:45%" onclick="say(6)">3</button><button class="hot" style="left:55%;top:78%" onclick="say(7)">4</button><button class="hot" style="left:85%;top:65%" onclick="say(8)">5</button></div></div>
<div class="page"><div class="photo p4"><button class="hot" style="left:30%;top:53%" onclick="say(9)">1</button><button class="hot" style="left:68%;top:53%" onclick="say(10)">2</button><button class="hot" style="left:50%;top:62%" onclick="say(11)">3</button></div></div>
<div class="nav"><button id="prev" onclick="move(-1)">← Précédent</button><div class="count" id="count">1 / 4</div><button id="next" onclick="move(1)">Suivant →</button></div>
</div></main>
<script>
const texts={
1:"Mes portes et mes charnières sont en bon état.",
2:"J'ouvre ma porte, je surveille mon environnement et je fixe la porte. J'annonce : ma porte s'ouvre correctement.",
3:"Je demande à l'inspecteur si je peux laisser fermer pour avoir trois points d'appui. J'ouvre la seconde porte pour vérifier qu'elle s'ouvre correctement et se ferme correctement.",
4:"Je monte dans le véhicule à l'aide de trois points d'appui.",
5:"J'annonce : je suis en présence d'un chargement de autant, qui est bien arrimé et bien réparti.",
6:"L'ensemble de ma caisse est en bon état et bien étanche.",
7:"Mon plancher est en bon état.",
8:"Je descends du véhicule.",
9:"Je referme ma porte en surveillant mon environnement.",
10:"Ma porte se ferme correctement.",
11:"Mes portes sont bien fermées. Thème 6 terminé."
};
let n=1;const pages=[...document.querySelectorAll('.page')],prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');
function stop(){if(window.speechSynthesis) speechSynthesis.cancel()}function say(i){stop();const u=new SpeechSynthesisUtterance(texts[i]);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function render(){stop();pages.forEach((p,i)=>p.classList.toggle('active',i===n-1));count.textContent=n+' / 4';prev.disabled=n===1;next.disabled=n===4;window.scrollTo({top:0,behavior:'smooth'})}function move(d){if(n+d>=1&&n+d<=4){n+=d;render()}}document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();
</script></body></html>
