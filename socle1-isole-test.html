var items=[],pos=0,sel=-1,errors=[],timer,seconds=600;
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}})}
function render(){var x=items[pos];sel=-1;document.getElementById("phase").textContent="SOCLE 1 — "+x.p;document.getElementById("counter").textContent="Question "+(pos+1)+" / "+items.length;document.getElementById("next").disabled=true;var opts=sh([x.c].concat(x.w));var h="<div class='box'><b>"+esc(x.q)+"</b></div><div class='box'>";opts.forEach(function(o,i){h+="<button class='choice' data-i='"+i+"'>"+String.fromCharCode(65+i)+" — "+esc(o)+"</button>"});h+="</div>";document.getElementById("qbox").innerHTML=h;document.querySelectorAll(".choice").forEach(function(b){b.onclick=function(){sel=+b.dataset.i;document.querySelectorAll(".choice").forEach(function(z){z.classList.remove("sel")});b.classList.add("sel");document.getElementById("next").disabled=false}})}
function finish(){clearInterval(timer);var h=errors.length?"<p><b>"+(8-errors.length)+" / 8</b> — "+errors.length+" erreur(s).</p>":"<div class='ok'><b>8 / 8 — aucune erreur.</b></div>";errors.forEach(function(e){h+="<div class='err'><b>"+esc(e.p)+"</b><br>"+esc(e.q)+"<br><b>Réponse attendue :</b> "+esc(e.c)+"<br><b>Ta réponse :</b> "+esc(e.got)+"</div>"});document.getElementById("out").innerHTML=h;document.getElementById("exam").classList.add("hidden");document.getElementById("result").classList.remove("hidden")}
function next(){var x=items[pos],opts=document.querySelectorAll(".choice"),chosen=opts[sel]?opts[sel].textContent.slice(4):"";var correct=x.c;if(chosen!==correct)errors.push({p:x.p,q:x.q,c:correct,got:chosen});if(pos<items.length-1){pos++;render()}else finish()}
function begin(){items=sh(Q.slice());pos=0;errors=[];document.getElementById("home").classList.add("hidden");document.getElementById("result").classList.add("hidden");document.getElementById("exam").classList.remove("hidden");seconds=600;timer=setInterval(function(){seconds--;document.getElementById("timer").textContent=Math.floor(seconds/60).toString().padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");if(seconds<=0)finish()},1000);render()}
document.getElementById("start").onclick=begin;document.getElementById("next").onclick=next;document.getElementById("restart").onclick=begin;
})();
