<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Permis C — Révisions plateau</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#101820;font-family:Arial,Helvetica,sans-serif}
  body{display:flex;justify-content:center;align-items:flex-start}
  .cover{position:relative;width:min(100vw,1024px);line-height:0;user-select:none;-webkit-user-select:none}
  .cover img{display:block;width:100%;height:auto}
  .hotspot{position:absolute;display:block;border:0;background:transparent;text-decoration:none;cursor:pointer;border-radius:3%;-webkit-tap-highlight-color:rgba(255,255,255,.15)}
  .hotspot:focus-visible{outline:4px solid #fff;outline-offset:-5px}
  .computer-access{position:absolute;right:2%;top:2%;z-index:5;line-height:1.2;background:rgba(16,24,32,.92);color:#fff;border:2px solid #fff;border-radius:12px;padding:10px 14px;font-size:clamp(12px,2vw,18px);font-weight:700;cursor:pointer}
  .computer-panel{display:none;position:absolute;z-index:10;left:50%;top:10%;transform:translateX(-50%);width:min(92%,650px);line-height:1.4;background:#fff;color:#101820;border-radius:16px;padding:20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .computer-panel.open{display:block}
  .computer-panel p{margin:0 0 12px}
  .computer-url{display:block;overflow-wrap:anywhere;background:#f2f4f7;border-radius:10px;padding:12px;font-weight:700;user-select:text;-webkit-user-select:text}
  .computer-close{margin-top:14px;border:0;border-radius:10px;padding:10px 16px;background:#101820;color:#fff;font-weight:700;cursor:pointer}
  @media(max-width:520px){.computer-access{padding:8px 10px;font-size:12px}.computer-panel{top:6%;padding:16px;font-size:14px}}
  /* Coordonnées en pourcentage de l'image validée 1024 × 1536 */
  .h1{left:1.8%; top:40.0%; width:23.6%; height:24.1%}
  .h2{left:26.5%;top:40.0%; width:23.2%; height:24.1%}
  .h3{left:50.8%;top:40.0%; width:23.2%; height:24.1%}
  .h4{left:75.1%;top:40.0%; width:23.2%; height:24.1%}
  .h5{left:1.8%; top:65.3%; width:23.6%; height:26.5%}
  .h6{left:26.5%;top:65.3%; width:23.2%; height:26.5%}
  .h7{left:50.8%;top:65.3%; width:23.2%; height:26.5%}
  .h8{left:75.1%;top:65.3%; width:23.2%; height:26.5%}
</style>
</head>
<body>
<main class="cover" aria-label="Permis C — Révisions plateau">
  <img src="page-garde-permis-c.png" alt="Page d'accueil Permis C — Révisions plateau">
  <button type="button" class="computer-access" id="computerAccess">💻 ACCÈS ORDINATEUR</button>
  <div class="computer-panel" id="computerPanel" role="dialog" aria-modal="true" aria-labelledby="computerTitle">
    <p id="computerTitle"><strong>Vous souhaitez réviser sur ordinateur ?</strong></p>
    <p>Ouvrez cette adresse sur votre ordinateur :</p>
    <span class="computer-url">jf-procedure-examen-plateau.github.io/permis-c/</span>
    <button type="button" class="computer-close" id="computerClose">FERMER</button>
  </div>
  <a class="hotspot h1" href="fiches-ecrites-menu.html" aria-label="Fiches écrites — 20 fiches de révision"></a>
  <a class="hotspot h2" href="socle-1-menu.html" aria-label="Socle 1 — Vérifications et sécurité"></a>
  <a class="hotspot h3" href="themes-menu.html" aria-label="Thèmes interactifs"></a>
  <a class="hotspot h4" href="fiches-orales-menu.html" aria-label="Fiches orales — 12 fiches et QCM"></a>
  <a class="hotspot h5" href="socle-2.html" aria-label="Socle 2 — Les essais de freins"></a>
  <a class="hotspot h6" href="manoeuvre-c.html" aria-label="Pistes d'examen — Les différentes pistes d'examen"></a>
  <a class="hotspot h7" href="examen-blanc.html" aria-label="Examen blanc"></a>
  <a class="hotspot h8" href="trame-inspecteur-officielle-c.pdf" aria-label="Trame officielle de l'inspecteur"></a>
</main>
<script>
  const computerAccess=document.getElementById('computerAccess');
  const computerPanel=document.getElementById('computerPanel');
  const computerClose=document.getElementById('computerClose');
  computerAccess.addEventListener('click',()=>computerPanel.classList.add('open'));
  computerClose.addEventListener('click',()=>computerPanel.classList.remove('open'));
</script>
</body>
</html>
